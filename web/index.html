<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <!-- The daemon replaces this per response with the nonce its CSP allows for injected style tags. -->
    <meta name="kogin-style-nonce" content="__KOGIN_STYLE_NONCE__" />
    <!-- The daemon replaces this with its per-launch write token, sent with every request that changes state. -->
    <meta name="kogin-write-token" content="__KOGIN_WRITE_TOKEN__" />
    <title>Kogin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
