openapi: 3.0.3
info:
  title: Mini-Orca local daemon API
  version: 6.0.0-dev
  description: |
    Local REST API used by the Mini-Orca Web UI. The daemon is the LLM
    boundary. Shared conversations capture up to eight Go/Markdown paths, produce
    checked proposals and require diff review and explicit Apply. Legacy one-file
    declaration APIs remain compatible. Source and diff views are read-only.
    Project import, semantic analysis, Analyze-all, and chat messages can send
    prompt content; a non-loopback HTTP or CLI provider requires explicit confirmation for
    each of those requests. Verified scans, validation, checks, Apply, and Undo
    do not send prompts. An explicitly started change workflow runs its trusted
    checks after generation; source Apply and Undo always require human action.
    Native ADK graphs retain separate stage and human-input outcomes. Persisted
    events, model verdicts, artifacts and restored approvals do not grant current
    execution or source-mutation authority. Optional external services require
    their configured capability and the explicit operation-specific grant.
servers:
  - url: http://localhost:9090
    description: Local daemon
tags:
  - name: Daemon
  - name: Projects
  - name: Chat
  - name: Drafts
paths:
  /api/projects/current:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read the selected project without changing the active project
      responses:
        '200': {description: Project summary, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-settings:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read configured or overridden agent settings without dispatch
      parameters:
        - {$ref: '#/components/parameters/AgentProjectID'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Passive private settings and safe configured model metadata; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSettings'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/agent-settings/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Confirm versioned settings for future admissions
      description: Replace complete roles and limits, or reset to operator configuration. Limits cannot exceed configured ceilings. Active runs retain their captured settings. Stale overrides require explicit reset. No source writes, provider dispatch, credential changes or tool grants.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSettingsControl'}}}}
      responses:
        '200': {description: Durably saved settings with an advanced version; no-store, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSettings'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Chat]
      description: List bounded local conversation summaries without generation or source contents.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ChangeHistoryEntry'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Chat]
      description: Capture a task and one to eight explicit Go/Markdown paths in this checkout or, with worktree, in a new branch (orca/<title slug>-<random>) and worktree under .worktrees/ created from the current HEAD. A worktree task needs confirm_execution and execution trust, a Git repository on a branch with a commit, and task files without uncommitted changes here; the worktree inherits this checkout's execution trust when it runs the same commands and its saved agent settings, and the task is captured with the worktree's project identity. A task that cannot be captured leaves no worktree or branch.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeOpenRequest'}}}}
      responses:
        '200': {description: The task; with worktree, also where it lives, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ChangeSession'}, {$ref: '#/components/schemas/ChangeOpened'}]}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/recovery:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Chat]
      description: Read the latest grouped mutation or interrupted recovery journal.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    get:
      tags: [Chat]
      description: Read a proposal and recheck source freshness.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/rules:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    get:
      tags: [Chat]
      description: Measure each file of a task against the budgets and import rules of its AGENTS.md files — the proposal where the task changed the file, the file as it is otherwise. No provider request and no project code runs.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Rules and budget state per task file, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeRules'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/messages:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Generate a scoped proposal or explicitly request bounded check-driven repair.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMessageRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/checks:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Check the current proposal; tests/vet require independent execution trust.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeCheckRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/workflow:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Start creation, test writing/execution and model review using captured profiles. Requires execution trust, a test path and consent for every selected remote profile. One active workflow per conversation; no automatic source Apply.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeWorkflowRequest'}}}}
      responses:
        '202': {description: Workflow admitted; poll the guarded session GET, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/workflow/cancel:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Cancel only the identified workflow; an old workflow ID cannot cancel its replacement.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeWorkflowControl'}}}}
      responses:
        '200': {description: Current workflow state, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/workflow/input:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Respond to the exact durable review request. Approve requires live checks and existing file-review guards; a receipt never applies source. Repeated matching decisions are idempotent.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeInputResponse'}}}}
      responses:
        '200': {description: Current guarded input result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/review-file:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Record inspection of one changed file for the current proposal hash. No provider, checks or source writes.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeFileReviewRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/review:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Record diff review for the current checked hash, with optional reviewer notes kept beside the approval. Planned sessions require each changed file to have been reviewed at this hash. A waiting workflow input is answered as approved.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeReviewRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/review-override:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Override the model reviewers' changes_requested verdict for the current checked hash with a reason. The workflow moves to awaiting_human_review; nothing is approved, and a human rejection cannot be overridden.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeReviewOverride'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/comments:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Add a reviewer comment on one line of the current proposal. It changes no source, revision or review state; open comments join the next revision or workflow run that sets include_comments.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeCommentRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/comments/delete:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Delete an open line comment; sent comments are history.
      requestBody: {required: true, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ChangeIdentity'}, {type: object, required: [id], properties: {id: {type: string}}}]}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/apply:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: "Explicitly apply the current reviewed proposal with grouped recovery. For a task that owns its worktree (session.worktree), this accepts it instead: the reviewed proposal, already in the worktree's files, is committed on the task branch on top of its base (head names the base, branch the task branch); nothing is written, and there is no Undo."
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeApplyRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/delete:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Delete a task's history. The body names the task version shown (project_id, revision, hash; project_revision is not checked, so stale tasks can be deleted). A task with running agents, or whose latest Apply can still be undone, returns 409.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeIdentity'}}}}
      responses:
        '200': {description: The deleted task, content: {application/json: {schema: {type: object, required: [deleted], properties: {deleted: {type: string}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/reanalyze:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Re-check an out-of-date task's issue against the current files with the Bug model (one request; remote models need confirm_remote_provider). still_valid captures the task again at the current source with its title, kind, plan, criteria, scope and linked issues, drops its proposal, checks, approval, comments and conversation, and adds a note; not_valid deletes the task and dismisses its linked issues in this checkout or, for a task in its own worktree, in the checkout that created it. The body names the task version shown (project_revision is not checked). A task that matches the current files returns 400; running agents, an Apply that can still be undone, or a task or file that changed during the request return 409. Publishes a `workflow` event with status `reanalyzed` or `deleted`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeReanalysisRequest'}}}}
      responses:
        '200': {description: The decision and its effect, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeReanalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/retake:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Retake a task in its own worktree whose files the main branch changed since it started (its main_changed), finished or not. One Bug-model request (remote models need confirm_remote_provider) checks whether the task's issue is still present in the main branch's current files; confirm_execution is required because a still-valid task checks out a new worktree. still_valid opens the task again in a new worktree from the main branch, with its title, kind, plan, criteria, scope (its first eight files) and linked issues, and a note; not_valid dismisses its linked issues. Either way the old task is deleted; its worktree is kept for the client to remove. A task the main branch did not change returns 400; running agents, an Apply that can still be undone, or a task or file that changed during the request return 409.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeRetakeRequest'}}}}
      responses:
        '200': {description: The decision and its effect, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeRetake'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/git/workspace:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      description: List local branches and all worktrees, including merge eligibility against the current branch, completed committed fixes and per-worktree errors. Eligibility does not predict merge conflicts.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Git workspace, content: {application/json: {schema: {$ref: '#/components/schemas/GitWorkspace'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/git/merge-preview:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      description: Preview incoming commits and a read-only diff without running filters or merging.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationRequest'}}}}
      responses:
        '200': {description: Observed Git outcome, content: {application/json: {schema: {$ref: '#/components/schemas/GitMergePreview'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/git/merge:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      description: Merge the reviewed committed worktree head into the current clean branch after all saved tasks are applied and committed, mark linked findings Done, then (unless keep_worktree) remove the clean source worktree and its local task history without force and delete the captured branch if it is unchanged and unused by another checkout. Completion persistence failures retain the worktree and return warnings; cleanup failures preserve completion and the merged state. Removal receipts independently confirm checkout and branch deletion.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationRequest'}}}}
      responses:
        '200': {description: Observed Git outcome, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/git/merge-checks:
    post:
      tags: [Projects]
      description: "Run the tests and lint of every subproject a merge changed on a copy of the merged checkout, after the merge. from is the commit the branch was on before the merge (previous_head of the merge result) and to the merged commit the checkout is on now. A failure is compared with the same command on the commit before the merge: failures that already happened there pass as known_failures. Runs project code, so it needs execution trust for the current revision; never changes the checkout."
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MergeChecksRequest'}}}}
      responses:
        '200': {description: The checks of the merged result, content: {application/json: {schema: {$ref: '#/components/schemas/MergeChecks'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/git/cleanup-merged:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      description: Reconcile a merge completed externally or retry cleanup. Requires current project and target identity, source_head, source_branch, both confirmations and execution trust. Reindex external source changes and grant trust for the updated revision first. Verifies source ancestry in the clean destination, completes linked findings, removes the clean worktree without force, and deletes its captured branch if unchanged and unused by another checkout. Retains unfinished task histories until explicit discard. Refreshes project facts after reconciliation. Does not attempt a merge. Squash or cherry-picked copies without ancestry are not eligible.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationRequest'}}}}
      responses:
        '200': {description: Observed integration and cleanup outcome; removed_worktree confirms deletion and warnings describe incomplete steps, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/git/discard-worktree:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      description: Remove the confirmed clean source worktree and its local task history without merging or forcing deletion, and reopen linked in-progress findings not owned by another task. Includes applied but unmerged fixes. Requires source_head and source_branch; keeps the current checkout, and keeps the branch unless the current branch already contains its commits (then it is deleted and returned as removed_branch). With discard_work, a worktree left with no tasks is removed even with uncommitted changes, and its branch is deleted even with commits of its own (refused while it has tasks). Status persistence failures return warnings alongside the removal receipt.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationRequest'}}}}
      responses:
        '200': {description: Observed removal outcome, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/git/abort-merge:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      description: Abort the identified merge, discarding conflict-resolution edits.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationRequest'}}}}
      responses:
        '200': {description: Observed Git outcome, content: {application/json: {schema: {$ref: '#/components/schemas/GitMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/changes/{sessionID}/undo:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: sessionID, required: true, schema: {type: string}}
    post:
      tags: [Chat]
      description: Restore the latest unchanged grouped Apply or recover an interrupted mutation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeApplyRequest'}}}}
      responses:
        '200': {description: Current guarded result, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeMutationResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis/selection:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      description: Read project inventory and saved exclusions without dispatching analysis.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: project_revision, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
      responses:
        '200': {description: Saved selection and file eligibility, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisFileSelection'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      description: Atomically save exclusions for future project analysis. Requires matching project and selection identities and no active, paused or interrupted run. Does not write source or dispatch analysis.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisSelectionRequest'}}}}
      responses:
        '200': {description: Saved selection, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisFileSelection'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/analysis/preview:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisPreviewRequest'}}}}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '200': {description: Whole-project admission preview, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRunPreview'}}}}
  /api/projects/current/analysis/run:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {in: query, name: project_revision, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
      description: Read current progress with required project_id and project_revision query guards; never dispatch.
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '204': {description: No saved run for this project}
        '200': {description: Current run, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRun'}}}}
    post:
      tags: [Projects]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRunStartRequest'}}}}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '202': {description: Durably admitted run, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRun'}}}}
  /api/projects/current/analysis/run/control:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRunControlRequest'}}}}
      responses:
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '200': {description: Updated control state, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisRun'}}}}
  /health:
    get:
      tags: [Daemon]
      summary: Health check
      responses:
        '200':
          description: Daemon is healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /status:
    get:
      tags: [Daemon]
      summary: Daemon workflow status
      responses:
        '200':
          description: Daemon status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
  /ui:
    get:
      tags: [Daemon]
      summary: Embedded local Web UI (lite IDE)
      responses:
        '200':
          description: HTML shell for the dashboard, explorer, guarded review, agent workflow, issues, docs, checks and Git merge review
          content:
            text/html:
              schema: {type: string}
  /ui/assets/{path}:
    get:
      tags: [Daemon]
      summary: Embedded Web UI stylesheet or ES module
      parameters:
        - name: path
          in: path
          required: true
          description: Clean relative asset path ending in .css or .js
          schema: {type: string}
      responses:
        '200':
          description: Static asset served with the Web UI Content-Security-Policy
          content:
            text/css:
              schema: {type: string}
            text/javascript:
              schema: {type: string}
        '404':
          description: Unknown, unsafe or non-asset path
  /api/models/current:
    get:
      tags: [Daemon]
      summary: Effective scoped model catalog
      responses:
        '200':
          description: Non-secret analyze, bug, and function model scopes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
  /api/models/available:
    get:
      tags: [Daemon]
      summary: Available configured, Pi and Agy models, independent of operation
      description: Reads Pi's offline available-model RPC catalog and Agy's live models command in isolated processes. Never sends a prompt or project context. Agy may contact its catalog service. Accepts no query parameters. Discovery failures retain configured choices and the other CLI's models with a separate unavailable status for each failed catalog.
      responses:
        '200':
          description: Non-secret model choices and configured defaults.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailableModels'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/import:
    post:
      tags: [Projects]
      summary: Import and analyze a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectImportRequest'}
      responses:
        '200':
          description: Imported project analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/setup:
    get:
      tags: [Projects]
      description: The project's configuration as setup edits it. Secrets are reported only as api_key_set.
      parameters:
        - {in: query, name: project_id, required: true, schema: {type: string}}
        - {in: query, name: project_revision, required: true, schema: {type: string}}
      responses:
        '200': {description: Project setup, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSetup'}}}}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      description: Write the project's .mini-orca/config.yaml (0600, kept out of Git) and apply it without a restart. Refused with 409 while work runs.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSetupRequest'}}}}
      responses:
        '200': {description: The saved setup, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSetup'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/setup/timeouts:
    post:
      tags: [Projects]
      description: Write only the time limits to the project's .mini-orca/config.yaml and apply them without a restart; agent overrides are kept. Refused with 409 while work runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, project_revision, timeouts]
              properties:
                project_id: {type: string}
                project_revision: {type: string}
                timeouts: {$ref: '#/components/schemas/SetupTimeouts'}
      responses:
        '200': {description: The setup with the saved time limits, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSetup'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/setup/skip:
    post:
      tags: [Projects]
      description: Keep the daemon's configuration for the project and stop offering setup.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [project_id, project_revision], properties: {project_id: {type: string}, project_revision: {type: string}}}}}}
      responses:
        '200': {description: The setup with state skipped, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectSetup'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/setup/test-model:
    post:
      tags: [Projects]
      description: Send one short request, recorded as an agent run, to a model as setup would configure it for a scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, project_revision, scope, model]
              properties:
                project_id: {type: string}
                project_revision: {type: string}
                scope: {type: string, enum: [analyze, bug, code]}
                model: {$ref: '#/components/schemas/SetupModel'}
      responses:
        '200':
          description: The test outcome; a failed request is ok false with its reason.
          content:
            application/json:
              schema:
                type: object
                required: [ok, latency_ms]
                properties:
                  ok: {type: boolean}
                  model: {type: string}
                  latency_ms: {type: integer}
                  reason: {type: string}
                  detail: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/restore:
    post:
      tags: [Projects]
      summary: Restore a previously imported project without model access
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectRestoreRequest'}
      responses:
        '200':
          description: Restored project analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectAnalysis'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/projects/current/overview:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Source-free project workspace overview
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Deterministic metrics, optional structured analysis, coverage, and source-separated finding counts, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectOverview'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/docs/component:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: One docs component's code files
      description: 'The code files in the directories a docs component groups, each with its language, line count and the first sentence of the summary the last analysis wrote for its current content (absent when there is none). Reads saved summaries only and never calls a model. path is the component path as ProjectDocsReport.components lists it.'
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: The component's files, content: {application/json: {schema: {$ref: '#/components/schemas/DocsComponentFiles'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/docs/refresh:
    post:
      tags: [Projects]
      summary: Start writing the docs' model-written parts again
      description: 'Starts a background refresh with the analyze model: components whose files'' summaries changed are summarized again, then the project overview is written from all component summaries. One refresh at a time; ProjectOverview.docs_refresh reports it. A remote analyze model needs confirm_remote_provider. It stops when the project changes or the daemon shuts down; summaries written before a stop or failure are kept.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocsRefreshRequest'}
      responses:
        '202': {description: The running refresh, content: {application/json: {schema: {$ref: '#/components/schemas/DocsRefresh'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/ask:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Ask the codebase a question
      description: 'The Review role''s model runs as an agent (Claude Code, Agy or Pi) with read-only tools over the checkout, starting from the docs, and ends with an answer and citations. Mini-Orca checks each citation: the file is readable under the context policy, the lines exist and contain the quote (white space aside). Synchronous, at most five minutes; nothing is written or kept. A CLI model is remote and needs confirm_remote_provider.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AskRequest'}
      responses:
        '200': {description: The answer with checked citations, content: {application/json: {schema: {$ref: '#/components/schemas/AskAnswer'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: List source-free verified findings and AI suggestions
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: source
          in: query
          schema: {type: string, enum: [ai, parser, vet, test, lint, semgrep, rules, security_rules]}
        - name: confidence
          in: query
          schema: {type: string, enum: [suggested, tool_reported]}
        - name: severity
          in: query
          schema: {type: string, enum: [low, medium, high]}
        - name: status
          in: query
          schema: {type: string, enum: [open, dismissed, fixed, retired]}
        - name: freshness
          in: query
          schema: {type: string, enum: [fresh, stale]}
      responses:
        '200': {description: Sanitized findings with their provenance and lifecycle, content: {application/json: {schema: {$ref: '#/components/schemas/FindingsResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings/{findingID}/task:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: path, name: findingID, required: true, schema: {type: string}}
    get:
      tags: [Projects]
      summary: Draft the task that fixes one issue; nothing is saved
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200':
          description: A task draft for the composer
          content:
            application/json:
              schema:
                type: object
                required: [kind, title, description, paths, acceptance_criteria]
                properties:
                  kind: {type: string, enum: [fix, security, performance]}
                  title: {type: string}
                  description: {type: string}
                  paths: {type: array, items: {type: string}, description: The issue's file and its conventional test (an existing one when there is one).}
                  acceptance_criteria: {type: array, items: {type: string}}
                  finding_targets: {type: array, items: {$ref: '#/components/schemas/FindingTarget'}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings/task:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Draft one task that fixes several open issues of one file; nothing is saved
      description: 'The issues (one to ten, as repeated id parameters) must be open and in the same file. The draft names the file and its conventional test, lists every issue in line order with its line, function, message and evidence, joins their criteria (each once, at most sixteen) and links every issue, so merging the task marks each fixed. One id drafts like GET findings/{findingID}/task.'
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - {in: query, name: id, required: true, schema: {type: array, items: {type: string}, minItems: 1, maxItems: 10}, style: form, explode: true}
      responses:
        '200':
          description: A task draft for the composer, shaped like the one-issue draft
          content:
            application/json:
              schema:
                type: object
                required: [kind, title, description, paths, acceptance_criteria]
                properties:
                  kind: {type: string, enum: [fix, security, performance], description: The kind the issues share; fix when they differ.}
                  title: {type: string}
                  description: {type: string}
                  paths: {type: array, items: {type: string}}
                  acceptance_criteria: {type: array, items: {type: string}}
                  finding_targets: {type: array, items: {$ref: '#/components/schemas/FindingTarget'}}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/rules:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Test file patterns and the AGENTS.md files that declare code rules
      responses:
        '200': {description: The project's code rules for the Web UI, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectRules'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/findings/{findingID}:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    patch:
      tags: [Projects]
      summary: Update a finding's user triage status
      parameters:
        - name: findingID
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FindingTriageRequest'}}}
      responses:
        '204': {description: Triage status recorded.}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/events:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Stream Server-Sent Events (SSE) for project analysis, reindex and workflow progress
      responses:
        '200':
          description: Server-Sent Events stream of ready and update notifications; each update's data is an Event.
          content:
            text/event-stream:
              schema:
                type: string
  /api/projects/current/quarantine:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: query, name: project_id, required: true, schema: {type: string}}
      - {in: query, name: project_revision, required: true, schema: {type: string}}
    get:
      tags: [Projects]
      summary: Records set aside as unreadable or skipped as newer, with remedies
      responses:
        '200': {description: Set-aside and skipped records, content: {application/json: {schema: {$ref: '#/components/schemas/QuarantineReport'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/usage:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
      - {in: query, name: project_id, required: true, schema: {type: string}}
      - {in: query, name: project_revision, required: true, schema: {type: string}}
    get:
      tags: [Chat]
      summary: Agent usage and estimated cost per task
      responses:
        '200': {description: Usage per task, other work and the total, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeUsageReport'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/execution-trust:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Read the current project's trusted local execution scope
      parameters:
        - {$ref: '#/components/parameters/ProjectRevision'}
        - name: task_test_name
          in: query
          required: false
          schema: {type: string}
          description: Exact generated Go test name for a task-test trust preview.
      responses:
        '200': {description: Remembered project trust bound to current sources and the exact command scope, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Save or revoke local execution trust for the current project path
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrustRequest'}}}
      responses:
        '200': {description: Project trust decision saved in private user settings, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionTrust'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/index:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Deterministic active-project index
      responses:
        '200':
          description: Eligible project-relative file and symbol facts without source text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '404': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/info:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Selected file information
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
      responses:
        '200':
          description: Safe project-relative file information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '400': {$ref: '#/components/responses/Error'}
  /api/projects/current/files/analysis:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    get:
      tags: [Projects]
      summary: Cached semantic analysis for one selected file
      parameters:
        - {$ref: '#/components/parameters/ProjectPath'}
        - {$ref: '#/components/parameters/ProjectRevision'}
      responses:
        '200': {description: Cached status and source-free analysis, content: {application/json: {schema: {$ref: '#/components/schemas/FileAnalysis'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/projects/current/reindex:
    parameters:
      - {$ref: '#/components/parameters/WorktreePath'}
    post:
      tags: [Projects]
      summary: Refresh deterministic project facts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReindexRequest'}
      responses:
        '200':
          description: Rebuilt deterministic index with its current project revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectIndex'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
components:
  parameters:
    AgentProjectID:
      in: query
      name: project_id
      required: true
      schema: {type: string}
    AgentRunID:
      in: path
      name: runID
      required: true
      schema: {type: string}
    WorktreePath:
      in: query
      name: worktree_path
      required: false
      description: Optional absolute path of another registered worktree in the active repository. Requests use that checkout's project identity, jobs, trust and proposal guards without changing the active project. Membership is rechecked on every request.
      schema: {type: string}
    ProjectPath:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Canonical project-relative path only.
    ProjectRevision:
      name: project_revision
      in: query
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    AgentUsage:
      type: object
      description: Shared budget charges across descendants, including conservative estimates; do not add child totals together. Accounting is absent for legacy measurements that cannot be reconstructed.
      properties:
        accounting: {$ref: '#/components/schemas/AgentUsageAccounting'}
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        unknown_usage_calls: {type: integer}
        reserved_input_tokens: {type: integer, format: int64}
        reserved_output_tokens: {type: integer, format: int64}
        active_calls: {type: integer}
        elapsed_millis: {type: integer, format: int64}
    AgentUsageAccounting:
      type: object
      required: [version, providers]
      properties:
        version: {type: integer, enum: [1]}
        providers: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/AgentProviderUsage'}}
    AgentProviderUsage:
      type: object
      description: Source-free grouped accounting. Reported counts include partial lower bounds; charged minus reported tokens are conservative estimates. Cache tokens are included in input; missing cache knowledge remains unknown. Failed calls can still have complete usage receipts.
      properties:
        model_key: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of the JSON pair of configured provider and model; excludes endpoint and credentials.}
        model_calls: {type: integer, minimum: 0}
        active_calls: {type: integer, minimum: 0}
        failed_calls: {type: integer, minimum: 0}
        unknown_usage_calls: {type: integer, minimum: 0}
        reported_calls: {type: integer, minimum: 0}
        partial_usage_calls: {type: integer, minimum: 0}
        cache_known_calls: {type: integer, minimum: 0}
        input_tokens: {type: integer, format: int64, minimum: 0}
        output_tokens: {type: integer, format: int64, minimum: 0}
        reported_input_tokens: {type: integer, format: int64, minimum: 0}
        reported_output_tokens: {type: integer, format: int64, minimum: 0}
        cached_input_tokens: {type: integer, format: int64, minimum: 0}
    AgentRoleSettings:
      type: object
      additionalProperties: false
      required: [creation, testing, review]
      properties:
        creation: {$ref: '#/components/schemas/ModelSelection'}
        testing: {$ref: '#/components/schemas/ModelSelection'}
        review: {$ref: '#/components/schemas/ModelSelection'}
    AgentPreferences:
      type: object
      additionalProperties: false
      required: [roles, limits]
      properties:
        roles: {$ref: '#/components/schemas/AgentRoleSettings'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        disabled_skills: {type: array, deprecated: true, maxItems: 8, items: {type: string, maxLength: 192}, description: Accepted from older clients and ignored; project skills were removed.}
    AgentSettings:
      type: object
      required: [project_id, project_revision, configuration, version, state, roles, limits, ceilings, models, role_models]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740992}
        state: {type: string, enum: [configured, overridden, stale]}
        roles: {$ref: '#/components/schemas/AgentRoleSettings'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        ceilings: {$ref: '#/components/schemas/AgentLimits'}
        models: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/ScopedModel'}}
    AgentSettingsControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, configuration, version, action, confirm]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        configuration: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        action: {type: string, enum: [replace, reset]}
        confirm: {type: boolean, enum: [true]}
        values:
          allOf:
            - {$ref: '#/components/schemas/AgentPreferences'}
          description: Required for replace and forbidden for reset; stale saved overrides require reset.
    AgentLimits:
      type: object
      additionalProperties: false
      required: [model_calls, tool_calls, repairs, input_tokens, output_tokens, elapsed_seconds, concurrent_calls]
      properties:
        model_calls: {type: integer}
        tool_calls: {type: integer}
        repairs: {type: integer}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        elapsed_seconds: {type: integer}
        concurrent_calls: {type: integer}
    AgentCostEstimate:
      type: object
      required: [status, known_subtotal, reasons]
      properties:
        status: {type: string, enum: [estimated, unknown]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        price_version: {type: string, maxLength: 64}
        known_subtotal: {type: number, minimum: 0}
        total: {type: number, minimum: 0, description: Present only when the token cost can be estimated completely with configured rates; not an invoice.}
        reasons:
          type: array
          uniqueItems: true
          items: {type: string, enum: [price_table_unavailable, legacy_usage, model_rate_unavailable, usage_incomplete, cache_split_unknown]}
    Error:
      type: object
      required: [type, message, user_message]
      properties:
        type: {type: string}
        message: {type: string}
        user_message: {type: string}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, example: ok}
        version: {type: string}
    Status:
      type: object
      required: [status, version, workflow]
      properties:
        status: {type: string, example: running}
        version: {type: string}
        workflow: {type: string, example: shared_proposals}
    ScopedModel:
      type: object
      required: [scope, profile, model, provider_origin, remote_provider, temperature, max_tokens, context_max_tokens, timeout, max_retries]
      properties:
        scope: {type: string, enum: ["", analyze, bug, code], description: Empty for unassigned catalog choices.}
        profile: {$ref: '#/components/schemas/ModelSelection'}
        model: {type: string}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Optional configured reasoning effort supported by the selected provider.}
        provider_origin: {type: string, description: 'Sanitized HTTP origin, or cli://agy or cli://pi. Never includes a CLI executable path.'}
        remote_provider: {type: boolean, description: CLI providers always require confirmation because their downstream destination is not independently verified.}
        temperature: {type: number, nullable: true, description: Null for CLI providers without sampling controls.}
        max_tokens: {type: integer, nullable: true, description: Null for CLI providers without output-token controls.}
        context_max_tokens: {type: integer}
        timeout: {type: string}
        max_retries: {type: integer}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
    ModelCapabilities:
      type: object
      description: Implemented adapter protocols, not model entitlements. Older metadata may omit this object; missing capabilities are unavailable.
      required: [completion, json_schema, tools, streaming]
      properties:
        completion: {type: boolean}
        json_schema: {type: boolean}
        tools: {type: boolean}
        streaming: {type: boolean}
    ModelSelection:
      type: string
      minLength: 1
      maxLength: 644
      pattern: '^(analyze|bug|code|configured:[0-9a-fA-F]{64}|pi:[^/]+/.+|agy:[a-zA-Z0-9][a-zA-Z0-9._-]{0,511}|claude:[a-zA-Z0-9][a-zA-Z0-9._-]{0,119}(\[[a-z0-9]+\])?)$'
      description: Opaque ID returned by the available model catalog. Legacy analyze, bug and code profile names remain supported. Catalog membership is rechecked before admission; endpoints, executable paths and credentials cannot be supplied.
    AvailableModels:
      type: object
      required: [models, defaults, pi, agy, claude]
      properties:
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelChoice'}
        defaults:
          type: object
          required: [analyze, bug, code]
          properties:
            analyze: {$ref: '#/components/schemas/ModelSelection'}
            bug: {$ref: '#/components/schemas/ModelSelection'}
            code: {$ref: '#/components/schemas/ModelSelection'}
        pi:
          $ref: '#/components/schemas/ModelDiscovery'
        agy:
          $ref: '#/components/schemas/ModelDiscovery'
        claude:
          $ref: '#/components/schemas/ModelDiscovery'
          description: Claude Code has no catalog command; ready means its executable is installed, and the choices are its model aliases. Whether the signed-in plan includes a model shows when a run starts.
    ModelDiscovery:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ready, unavailable]}
        message: {type: string, description: Sanitized discovery failure and recovery guidance.}
    ModelChoice:
      type: object
      required: [id, name, provider, source, location, model]
      properties:
        id: {$ref: '#/components/schemas/ModelSelection'}
        name: {type: string}
        provider: {type: string, description: Transport provider for configured or Agy models; Pi provider ID for Pi models; anthropic for Claude Code models.}
        source: {type: string, enum: [configured, pi, agy, claude]}
        location: {type: string, enum: [local, remote, unknown], description: Pi location is inferred from catalog baseUrl metadata; Agy location is unknown because its catalog omits endpoints. It does not waive CLI prompt consent or verify availability of the endpoint.}
        model: {$ref: '#/components/schemas/ScopedModel'}
    ModelCatalog:
      type: object
      required: [scopes, config_file]
      properties:
        config_file: {type: string, description: 'Absolute path of the configuration file the daemon read; empty when no config.yaml was found and the built-in local defaults apply.'}
        scopes:
          type: object
          required: [analyze, bug, code]
          properties:
            analyze: {$ref: '#/components/schemas/ScopedModel'}
            bug: {$ref: '#/components/schemas/ScopedModel'}
            code: {$ref: '#/components/schemas/ScopedModel'}
    SetupModel:
      type: object
      required: [provider, model]
      properties:
        provider: {type: string, enum: ['', openai, gemini, vertex, agy, pi, claude]}
        model: {type: string}
        api_base_url: {type: string}
        api_key: {type: string, writeOnly: true, description: Empty keeps the configured key for the same provider.}
        api_key_set: {type: boolean, readOnly: true}
        clear_api_key: {type: boolean, writeOnly: true}
        vertex_project: {type: string}
        vertex_location: {type: string}
        cli_path: {type: string}
        reasoning_effort: {type: string}
        temperature: {type: number}
        max_tokens: {type: integer}
        context_max_tokens: {type: integer}
    SetupRoles:
      type: object
      required: [creation, testing, review]
      properties:
        creation: {type: string, enum: [analyze, bug, code]}
        testing: {type: string, enum: [analyze, bug, code]}
        review: {type: string, enum: [analyze, bug, code]}
    ProjectSetupRequest:
      type: object
      required: [project_id, project_revision, models, roles, limits]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        models:
          type: object
          required: [analyze, bug, code]
          properties:
            analyze: {$ref: '#/components/schemas/SetupModel'}
            bug: {$ref: '#/components/schemas/SetupModel'}
            code: {$ref: '#/components/schemas/SetupModel'}
        roles: {$ref: '#/components/schemas/SetupRoles'}
        limits: {$ref: '#/components/schemas/AgentLimits'}
        timeouts: {$ref: '#/components/schemas/SetupTimeouts'}
    SetupTimeouts:
      type: object
      description: Time limits in seconds. A setup read reports the values in effect, defaults included; a save sets every one, from 1 to 86400.
      required: [import_seconds, analysis_seconds, generation_seconds, workflow_model_seconds, focused_check_seconds]
      properties:
        import_seconds: {type: integer, minimum: 1, maximum: 86400}
        analysis_seconds: {type: integer, minimum: 1, maximum: 86400}
        generation_seconds: {type: integer, minimum: 1, maximum: 86400}
        workflow_model_seconds: {type: integer, minimum: 1, maximum: 86400}
        focused_check_seconds: {type: integer, minimum: 1, maximum: 86400}
    ProjectSetup:
      allOf:
        - {$ref: '#/components/schemas/ProjectSetupRequest'}
        - type: object
          required: [state, config_file, daemon_config_file, timeouts]
          properties:
            state: {type: string, enum: [needed, skipped, configured, invalid]}
            config_file: {type: string}
            daemon_config_file: {type: string}
            error: {type: string}
            overrides_reset: {type: boolean, description: In a save result, whether agent overrides were reset.}
    ProjectImportRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path selected by the local user.}
        confirm_remote_provider: {type: boolean, description: 'Allows the project overview request to a non-loopback analyze model; without it, import records only the deterministic inventory.'}
    ProjectRestoreRequest:
      type: object
      required: [project_path]
      properties:
        project_path: {type: string, description: Absolute path of a previously imported local project.}
    ProjectAnalysis:
      type: object
      required: [project_id, project_revision, name, path, type, file_count, source_file_count, total_lines, languages, files, summary, ai_status, analyzed_at]
      properties:
        project_id: {type: string, description: Stable hash of the canonical imported root.}
        project_revision: {type: string, description: Content-derived revision captured by mutable requests.}
        name: {type: string}
        path: {type: string}
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
        files: {type: array, items: {type: string}}
        summary: {type: string}
        ai_status: {type: string}
        report: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        analyzed_at: {type: string, format: date-time}
    ProjectOverview:
      type: object
      required: [project_id, project_revision, metrics, analysis, analysis_coverage, finding_counts]
      properties:
        analysis_run: {$ref: '#/components/schemas/AnalysisRun'}
        project_id: {type: string}
        project_revision: {type: string}
        metrics: {$ref: '#/components/schemas/ProjectMetrics'}
        analysis: {$ref: '#/components/schemas/ProjectAnalysisReport'}
        docs: {$ref: '#/components/schemas/ProjectDocsReport'}
        docs_refresh: {$ref: '#/components/schemas/DocsRefresh'}
        analysis_coverage: {$ref: '#/components/schemas/AnalysisCoverage'}
        finding_counts: {$ref: '#/components/schemas/FindingCounts'}
    ProjectDocsReport:
      type: object
      description: "The project's docs, built on every read: the overview's purpose, architecture and walkthroughs (model-written), and the components, the imports between them, entry points, commands and dependencies read from the code (the project map, the subprojects' check commands and the manifests). Component summaries are model-written and say where they come from."
      required: [schema_version, project_id, project_revision, status, overview, components, walkthroughs, commands, dependencies, graph, updated_at]
      properties:
        schema_version: {type: string, enum: ['4']}
        project_id: {type: string}
        project_revision: {type: string}
        status: {type: string, description: "The model-written parts' freshness: the project overview's status."}
        overview:
          type: object
          required: [languages, files, lines]
          properties:
            purpose: {type: string, description: Model-written; absent without an overview.}
            architecture: {type: string, description: "Model-written prose on how the parts fit; absent without an overview, and for an older overview that drew a diagram instead."}
            languages:
              type: array
              description: Programming languages by indexed file count, most first.
              items:
                type: object
                required: [name, files]
                properties:
                  name: {type: string}
                  files: {type: integer}
            files: {type: integer}
            lines: {type: integer}
        components:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, path, languages, files, lines, summary, responsibilities, entry_points, imports, used_by]
            properties:
              name: {type: string}
              path: {type: string, description: "A directory of code; '.' is the project root. Small folders are folded into their parent so at most 16 components show."}
              languages: {type: array, items: {type: string}}
              files: {type: integer}
              lines: {type: integer}
              summary: {type: string}
              summary_source: {type: string, enum: [module, overview], description: "module: the component's own summary from its files' summaries; overview: the project overview's model; absent: no summary yet."}
              responsibilities: {type: array, description: At most three in summaries from module-summary-v2., items: {type: string}}
              entry_points: {type: array, description: Where programs in this component start., items: {$ref: '#/components/schemas/DocsEntryPoint'}}
              imports: {type: array, description: Components this one imports, resolved from the code., items: {type: string}}
              used_by: {type: array, description: Components that import this one., items: {type: string}}
        walkthroughs:
          type: array
          description: "The main things the project does, traced through its files by the overview's model. Only steps whose files the project still has are listed; a walkthrough without any is left out."
          items: {$ref: '#/components/schemas/ProjectWalkthrough'}
        commands:
          type: array
          description: The subprojects' test and lint commands and the package scripts that build or start them.
          items:
            type: object
            required: [label, command, source]
            properties:
              label: {type: string, description: "Test, Lint, Build, Dev, Start or Serve"}
              command: {type: string}
              dir: {type: string, description: Where it runs, relative to the project root; absent for the root.}
              source: {type: string, description: The file that declares it.}
        dependencies:
          type: array
          items:
            type: object
            required: [name, kind, source]
            properties:
              name: {type: string}
              kind: {type: string, description: "The ecosystem, such as Go module or npm package"}
              version: {type: string}
              dev: {type: boolean, description: A development dependency.}
              source: {type: string, description: The manifest that declares it}
        graph:
          type: object
          description: What the components diagram is drawn from.
          required: [edges, entry_points, modules]
          properties:
            edges:
              type: array
              items:
                type: object
                required: [from, to, imports]
                properties:
                  from: {type: string}
                  to: {type: string}
                  imports: {type: integer, description: Import statements from one component to the other}
            entry_points: {type: array, items: {$ref: '#/components/schemas/DocsEntryPoint'}}
            modules: {type: integer, description: Directories of code before folding}
            truncated: {type: boolean}
        updated_at: {type: string}
    DocsEntryPoint:
      type: object
      required: [path, kind]
      properties:
        path: {type: string}
        kind: {type: string, description: "main, bin, package main or script"}
        detail: {type: string}
    ProjectWalkthrough:
      type: object
      required: [title, summary, steps]
      properties:
        title: {type: string}
        summary: {type: string}
        steps:
          type: array
          items:
            type: object
            required: [text, path]
            properties:
              text: {type: string}
              path: {type: string, description: A file the project has.}
              symbol: {type: string, description: "The function, method or type the step happens in, only when Mini-Orca found its declaration in the file."}
              line: {type: integer, description: The line of that declaration.}
    DocsComponentFiles:
      type: object
      required: [path, files]
      properties:
        path: {type: string}
        files:
          type: array
          items:
            type: object
            required: [path, language, lines]
            properties:
              path: {type: string}
              language: {type: string}
              lines: {type: integer}
              summary: {type: string, description: "The first sentence of the summary the last analysis wrote for the file's current content."}
    ProjectMetrics:
      type: object
      required: [type, file_count, source_file_count, total_lines, languages]
      properties:
        type: {type: string}
        build_file: {type: string}
        file_count: {type: integer}
        source_file_count: {type: integer}
        total_lines: {type: integer}
        languages: {type: object, additionalProperties: {type: integer}}
    ProjectAnalysisReport:
      type: object
      required: [schema_version, project_id, project_revision, components, walkthroughs, risks, status, model, profile, prompt_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        purpose: {type: string, description: Two or three sentences on what the project is and does.}
        architecture: {type: string, description: "Prose on how the main parts fit; reports from prompt project-analysis-v6 and older may hold a Mermaid diagram instead."}
        components: {type: array, items: {type: string}, description: "'path (Name): responsibility' lines, used for components without a summary of their own."}
        walkthroughs: {type: array, items: {$ref: '#/components/schemas/ProjectWalkthrough'}, description: "Checked when written: steps keep only files the project had, and a symbol only where the file declares it."}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}, description: Become AI-suggested issues; not shown in the docs.}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        status: {type: string, enum: [fresh, stale, failed, unavailable]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        generated_at: {type: string, format: date-time}
    AnalysisCoverage:
      type: object
      required: [total, fresh, stale, missing, failed, running, partial, unavailable]
      properties:
        total: {type: integer}
        fresh: {type: integer}
        stale: {type: integer}
        missing: {type: integer}
        failed: {type: integer}
        running: {type: integer}
        partial: {type: integer}
        unavailable: {type: integer}
    FindingCounts:
      type: object
      required: [verified, ai_suggestions]
      properties:
        verified: {type: integer, description: Count with non-AI source and tool_reported confidence.}
        ai_suggestions: {type: integer, description: Count with AI source and suggested confidence.}
    FindingsResponse:
      type: object
      required: [project_id, project_revision, findings]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        findings: {type: array, items: {$ref: '#/components/schemas/UnifiedFinding'}}
        completed: {type: array, description: "Merged finding targets for this project, independent of finding filters and evidence freshness.", items: {$ref: '#/components/schemas/FindingCompletion'}}
    FindingTarget:
      type: object
      additionalProperties: false
      required: [project_id, kind, id, path]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 1024, description: "Original finding project identity, retained when preparing in a worktree."}
        kind: {type: string, enum: [semantic, performance, security]}
        id: {type: string, minLength: 1, maxLength: 1024}
        path: {type: string, minLength: 1, maxLength: 1024, description: Project-relative finding path within the captured change paths.}
        source: {type: string, enum: [ai, deterministic], description: Required only for security findings; omitted for other producers.}
    FindingCompletion:
      type: object
      required: [project_id, kind, id, path, commit_oid]
      properties:
        project_id: {type: string}
        kind: {type: string, enum: [semantic, performance, security]}
        id: {type: string}
        path: {type: string}
        source: {type: string, enum: [ai, deterministic]}
        commit_oid: {type: string, description: Committed fix verified as an ancestor of the reviewed merged head.}
    UnifiedFinding:
      type: object
      required: [id, source, confidence, severity, title, message, project_id, project_revision, location, status, freshness, detected_at]
      properties:
        id: {type: string}
        category: {type: string, enum: [bugs, performance, security, maintainability], description: A FindingCategory; maintainability is used only by the rules source.}
        source: {type: string, enum: [ai, parser, vet, test, lint, semgrep, rules, security_rules], description: 'rules marks a file over its AGENTS.md code budgets (category maintainability), one finding per file, found by task checks and by every analysis run''s checks, which close it once the file is back within budget. lint marks a lint diagnostic (category maintainability), test a failing test (category bugs), parser a parser diagnostic, semgrep a match of the project''s own semgrep rules (category security when the rule names a CWE or the security category); the checks of each analysis run report them. vet marks go vet failures of the retired Go scan; lint closes them. security_rules marks a deterministic security rule match (category security, tool_reported). ai includes the semantic, Performance and Security AI stages; their originating_analysis is file, performance or security.'}
        confidence: {type: string, enum: [suggested, tool_reported]}
        severity: {type: string, enum: [low, medium, high]}
        title: {type: string}
        message: {type: string}
        rule: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        file_hash: {type: string}
        location: {$ref: '#/components/schemas/FindingLocation'}
        evidence: {type: string, description: Sanitized and bounded tool or model evidence.}
        status: {type: string, enum: [open, dismissed, fixed, retired]}
        freshness: {type: string, enum: [fresh, stale]}
        detected_at: {type: string, format: date-time}
        originating_analysis: {type: string, enum: [project, file]}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
    EngineeringInsight:
      type: object
      required: [mechanism, why_it_matters_here]
      description: Optional AI interpretation attached to its parent result; it carries no navigation or mutation authority.
      properties:
        mechanism: {type: string, maxLength: 1000}
        why_it_matters_here: {type: string, maxLength: 1000}
        tradeoff_or_failure_mode: {type: string, maxLength: 1000}
        transferable_lesson: {type: string, maxLength: 1000}
    FindingLocation:
      type: object
      properties:
        path: {type: string, description: Project-relative path.}
        start_line: {type: integer}
        end_line: {type: integer}
        symbol: {type: string, maxLength: 256, description: 'The innermost function around start_line ("Store.add"), named from the file the finding was made from; for a code-budget issue, the first function over a budget. Not part of the finding identity.'}
    FindingTriageRequest:
      type: object
      required: [project_revision, status]
      properties:
        project_revision: {type: string}
        status: {type: string, enum: [open, dismissed, fixed]}
    ExecutionTrustRequest:
      type: object
      required: [project_revision, confirm]
      properties:
        project_revision: {type: string}
        confirm: {type: boolean, description: Must be true after the client shows the command scope.}
    ExecutionTrust:
      type: object
      required: [project_id, project_revision, trusted, commands]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        trusted: {type: boolean, description: Remembered consent for this canonical project path, validated against the current revision and workspace. Revoked consent remains revoked after restart.}
        commands:
          type: array
          description: Exact argv vectors for this requested check or task-test action; gofmt and go vet are source-only and omitted.
          items: {type: array, items: {type: string}}
    FileInfo:
      type: object
      properties:
        path: {type: string}
        content_hash: {type: string, description: Hash required with a mutable request.}
        name: {type: string}
        extension: {type: string}
        language: {type: string}
        size_bytes: {type: integer, format: int64}
        line_count: {type: integer}
        modified_at: {type: string, format: date-time}
        binary: {type: boolean}
        content: {type: string}
    ProjectIndex:
      type: object
      required: [schema_version, project_id, project_revision, generated_at, files]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        generated_at: {type: string, format: date-time}
        files:
          type: array
          items: {$ref: '#/components/schemas/IndexFile'}
    IndexFile:
      type: object
      required: [path, content_hash, language, size_bytes, line_count, modified_at, binary, imports, analysis_status]
      properties:
        path: {type: string, description: Project-relative safe path.}
        content_hash: {type: string}
        language: {type: string}
        size_bytes: {type: integer, format: int64}
        line_count: {type: integer}
        modified_at: {type: string, format: date-time}
        binary: {type: boolean}
        imports: {type: array, items: {type: string}}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        analysis_status: {type: string}
    Diagnostic:
      type: object
      properties:
        message: {type: string}
        line: {type: integer}
    ReindexRequest:
      type: object
      required: [project_revision]
      properties:
        project_revision: {type: string}
    FileAnalysis:
      type: object
      required: [schema_version, project_id, project_revision, path, content_hash, language, status, prompt_version, context_policy_version, generated_at]
      properties:
        schema_version: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        path: {type: string}
        content_hash: {type: string}
        language: {type: string}
        purpose: {type: string}
        responsibilities: {type: array, items: {type: string}}
        imports: {type: array, items: {type: string}}
        dependencies: {type: array, items: {type: string}}
        side_effects: {type: array, items: {type: string}}
        risks: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        suggestions: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
        status: {type: string, enum: [fresh, missing, stale, failed, running]}
        failure: {type: string}
        model: {type: string}
        profile: {type: string}
        prompt_version: {type: string}
        context_policy_version: {type: string}
        instructions_fingerprint: {type: string, description: Identity of the applicable AGENTS.md guides used for analysis.}
        generated_at: {type: string, format: date-time}
    Finding:
      type: object
      properties:
        category: {$ref: '#/components/schemas/FindingCategory'}
        severity: {type: string}
        title: {type: string, description: Short content-specific name; older reports may omit it.}
        summary: {type: string}
        start_line: {type: integer, minimum: 1, description: 'Where the risk is: the line of the source the model copied as its anchor, found by Mini-Orca. Absent when it copied none that is in the file.'}
        end_line: {type: integer, minimum: 1}
        task_spec: {$ref: '#/components/schemas/BugTaskSpec'}
        engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}
    BugTaskSpec:
      type: object
      required: [schema_version, target_path, acceptance_criteria, non_goals]
      properties:
        schema_version: {type: string, enum: ['1', '2']}
        target_path: {type: string, description: Exact project-relative target file.}
        acceptance_criteria: {type: array, items: {type: string}, maxItems: 8}
        non_goals: {type: array, items: {type: string}, maxItems: 8}
        test_candidate: {$ref: '#/components/schemas/TestCandidateSpec'}
        go_test_candidate: {$ref: '#/components/schemas/GoTestCandidateSpec'}
    TestCandidateSpec:
      type: object
      required: [path, name, content]
      description: 'A regression test the analysis proposes, in any language: a test file by the common conventions, in the target''s language (a Go test in the target''s directory and package), that parses and spells its name. Advisory: the task drafted from the issue lists its file, shows it and asks for it to fail before the fix and pass after; only the task''s agents write it.'
      properties:
        path: {type: string, maxLength: 1024, description: Project-relative test file.}
        name: {type: string, maxLength: 200, description: The test's name as the content spells it.}
        content: {type: string, maxLength: 16384, description: The whole test file.}
    GoTestCandidateSpec:
      type: object
      required: [name, content]
      description: The Go-only candidate of reports saved before test_candidate; read and never used.
      properties:
        name: {type: string}
        content: {type: string}
    Suggestion:
      type: object
      properties: {title: {type: string}, summary: {type: string}, action: {type: string}, engineering_insight: {$ref: '#/components/schemas/EngineeringInsight'}}
    ContextManifest:
      type: object
      properties:
        included: {type: array, items: {$ref: '#/components/schemas/ContextFile'}}
        excluded: {type: array, items: {$ref: '#/components/schemas/ContextDecision'}}
        estimated_tokens: {type: integer}
        byte_limit: {type: integer}
        token_limit: {type: integer}
        truncated: {type: boolean}
        scope: {type: string, enum: [analyze, bug, code]}
        model: {type: string}
        provider_origin: {type: string, description: 'Sanitized HTTP origin, or cli://agy or cli://pi. Never includes a CLI executable path.'}
        remote_provider: {type: boolean}
    ContextFile:
      type: object
      properties:
        path: {type: string}
        size_bytes: {type: integer, format: int64}
        hash: {type: string}
        estimated_tokens: {type: integer}
        truncated: {type: boolean}
    ContextDecision:
      type: object
      properties:
        path: {type: string}
        include: {type: boolean}
        reason: {type: string}
    UnifiedDiff:
      type: object
      properties:
        old_path: {type: string}
        new_path: {type: string}
        lines: {type: array, items: {$ref: '#/components/schemas/DiffLine'}}
    DiffLine:
      type: object
      properties:
        kind: {type: string, enum: [context, added, removed]}
        old_line: {type: integer}
        new_line: {type: integer}
        text: {type: string}
    FindingCategory:
      type: string
      enum: [bugs, performance, security]
      description: Explicit semantic category. An absent legacy field means unclassified and never contributes to fresh section counts.
    AnalysisRunStatus:
      type: string
      enum: [queued, running, pausing, paused, canceling, canceled, interrupted, completed, completed_empty, partial, failed, unavailable, stale]
    AnalysisStage:
      type: string
      enum: [semantic, performance, security_rules, security_ai, feature_suggestions]
    AnalysisStageStatus:
      type: string
      enum: [pending, running, completed, completed_empty, partial, failed, skipped, unavailable, canceled, interrupted, stale]
    AnalysisRunLimits:
      type: object
      additionalProperties: false
      required: [batch_files, budget_seconds, max_attempts_per_stage]
      properties:
        batch_files: {type: integer, minimum: 1, maximum: 500, default: 100, description: Dispatch-window limit; does not truncate captured project inventory.}
        budget_seconds: {type: integer, minimum: 1, maximum: 3600, default: 900}
        max_attempts_per_stage: {type: integer, minimum: 1, maximum: 4, default: 2, description: Initial request plus all retries; cumulative across resumes.}
    AnalysisQueueIdentity:
      type: object
      required: [project_id, project_revision, policy_fingerprint, provider_fingerprint, queue_id]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        policy_fingerprint: {type: string, minLength: 1}
        provider_fingerprint: {type: string, minLength: 1}
        queue_id: {type: string, minLength: 1, description: Stable captured scope; excludes mutable cache availability.}
    AnalysisRunIdentity:
      allOf:
        - {$ref: '#/components/schemas/AnalysisQueueIdentity'}
        - type: object
          required: [id, generation]
          properties:
            id: {type: string, minLength: 1}
            generation: {type: string, minLength: 1}
    AnalysisSelectionRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, selection_id, excluded_paths]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        selection_id: {type: string, minLength: 1}
        excluded_paths: {type: array, maxItems: 20000, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 4096}, description: Canonical project-relative paths. Empty selects all eligible files.}
    AnalysisFileSelection:
      type: object
      required: [project_id, project_revision, selection_id, excluded_paths, files, editable, recovery]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        selection_id: {type: string}
        excluded_paths: {type: array, items: {type: string}}
        editable: {type: boolean}
        recovery: {$ref: '#/components/schemas/AnalysisRecoverySummary'}
        files:
          type: array
          items:
            type: object
            required: [path, reason, stages]
            properties:
              path: {type: string}
              reason: {type: string, description: Empty when selectable; otherwise the eligibility exclusion reason.}
              stages:
                type: array
                description: Read-only current analysis status per stage. Empty for ineligible files. Does not dispatch analysis.
                items:
                  type: object
                  required: [stage, status, reason]
                  properties:
                    stage: {$ref: '#/components/schemas/AnalysisStage'}
                    status: {type: string, enum: [fresh, stale, missing, failed, partial, running, pending, paused, interrupted, canceled, skipped, unavailable]}
                    reason: {type: string, description: Explanation of the current cache or retained run state.}
    AnalysisRecoverySummary:
      type: object
      required: [state, file_count, stage_count]
      description: Read-only daemon eligibility for recover_incomplete over the saved selection. States are evaluated in order running, continuation, not_started, blocked (source), available, blocked (model configuration), complete. Never dispatches analysis.
      properties:
        state: {type: string, enum: [running, continuation, not_started, blocked, available, complete]}
        file_count: {type: integer, minimum: 0, description: Selected eligible files with at least one recoverable stage, under the same model choices as the stage statuses.}
        stage_count: {type: integer, minimum: 0, description: Recoverable stages in those files.}
        reason: {type: string, description: Present for running, continuation and blocked; names the required action.}
    AnalysisModels:
      type: object
      additionalProperties: false
      required: [code]
      anyOf:
        - required: [performance, security]
        - required: [review]
      description: Independent model choices for one run. Legacy review supplies either missing Performance or Security choice. Omission uses Bug for Code and Analyze for reviews. Resume retains the captured choices; endpoints and credentials remain daemon-owned.
      properties:
        code: {$ref: '#/components/schemas/ModelSelection'}
        performance: {$ref: '#/components/schemas/ModelSelection'}
        security: {$ref: '#/components/schemas/ModelSelection'}
        review: {$ref: '#/components/schemas/ModelSelection'}
        features: {$ref: '#/components/schemas/ModelSelection', description: 'Read from saved runs of the retired feature-discovery step; a request that sets it is refused.'}
    AnalysisPreviewRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, scope, refresh, limits]
      properties:
        models: {$ref: '#/components/schemas/AnalysisModels'}
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        scope: {type: string, enum: [project]}
        refresh: {type: boolean}
        stale_only: {type: boolean, default: false, description: Select only files with stale analysis; excludes unrelated failed or missing files. Incompatible with refresh, retry_stale_failed, and recover_incomplete. Resume preserves the captured selection.}
        stale_path: {type: string, maxLength: 4096, description: Optional exact project-relative file path to narrow stale_only analysis. Requires stale_only and an eligible saved selection target. Captured in both identities; start must echo it and resume preserves it. Other saved results remain available.}
        retry_stale_failed: {type: boolean, default: false, description: Select only files with stale or failed analysis; incompatible with refresh. Resume preserves the admitted selection.}
        recover_incomplete: {type: boolean, default: false, description: 'Select only files with recoverable unfinished stages (stale, failed, partial, missing, canceled, interrupted or unavailable with a configured model); current stages stay cached and no source changes. Incompatible with refresh and retry_stale_failed. On resume the captured plan decides it; true for a non-recovery run returns 409.'}
        clear_results: {type: boolean, default: false, description: 'Clear previously saved analysis findings when starting a refreshed run from the beginning. Requires refresh and cannot be combined with stale_only, retry_stale_failed or recover_incomplete.'}
        limits: {$ref: '#/components/schemas/AnalysisRunLimits'}
        resume_run: {$ref: '#/components/schemas/AnalysisRunIdentity'}
    AnalysisFileIdentity:
      type: object
      required: [path, content_hash, language]
      properties:
        path: {type: string, minLength: 1, description: Canonical project-relative path.}
        content_hash: {type: string, minLength: 1}
        language: {type: string, minLength: 1}
    AnalysisProviderRequirement:
      type: object
      required: [id, stages, model, remote_confirmation_required]
      properties:
        id: {type: string, minLength: 1}
        stages: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/AnalysisStage'}}
        model: {$ref: '#/components/schemas/ScopedModel'}
        remote_confirmation_required: {type: boolean}
    AnalysisStagePlan:
      type: object
      required: [stage, eligible, cached, max_model_requests]
      properties:
        stage: {$ref: '#/components/schemas/AnalysisStage'}
        eligible: {type: boolean}
        cached: {type: boolean}
        carried: {type: string, enum: [failed, stale, skipped, canceled, unavailable], description: 'Retained files only: the earlier outcome kept for a stage without a current saved report; never dispatched.'}
        reason: {type: string, description: Sanitized eligibility/cache explanation.}
        provider_id: {type: string}
        max_model_requests: {type: integer, minimum: 0, maximum: 4, description: Zero for cache/rules/ineligible/retained work; otherwise includes all retries.}
    AnalysisPlannedFile:
      allOf:
        - {$ref: '#/components/schemas/AnalysisFileIdentity'}
        - type: object
          required: [size_bytes, stages]
          properties:
            size_bytes: {type: integer, format: int64, minimum: 0}
            retained: {type: boolean, description: 'Outside a scoped run (retry, stale-only, recovery, one stale file): saved reports are read back when the run is admitted, other stages keep their earlier outcome, and no model request is sent.'}
            stages: {type: array, items: {$ref: '#/components/schemas/AnalysisStagePlan'}}
    AnalysisExcludedFile:
      type: object
      required: [path, reason]
      properties:
        path: {type: string}
        reason: {type: string}
    AnalysisRunPreview:
      type: object
      required: [schema_version, preview_id, identity, scope, refresh, limits, files, excluded, providers, expected_model_requests, max_model_requests, security_review_intent_required]
      properties:
        models: {$ref: '#/components/schemas/AnalysisModels'}
        features: {$ref: '#/components/schemas/AnalysisFeaturePlan', description: Only in runs saved before feature discovery was retired.}
        docs: {$ref: '#/components/schemas/AnalysisDocsPlan'}
        checks: {$ref: '#/components/schemas/AnalysisChecksPlan'}
        schema_version: {type: string, enum: ['1']}
        preview_id: {type: string, minLength: 1, description: Admission fingerprint including remaining work, cache dispositions and request bounds.}
        identity: {$ref: '#/components/schemas/AnalysisQueueIdentity'}
        scope: {type: string, enum: [project]}
        refresh: {type: boolean}
        stale_only: {type: boolean, default: false, description: Select only files with stale analysis; excludes unrelated failed or missing files. Incompatible with refresh, retry_stale_failed, and recover_incomplete. Resume preserves the captured selection.}
        stale_path: {type: string, maxLength: 4096, description: Optional exact project-relative file path to narrow stale_only analysis. Requires stale_only and an eligible saved selection target. Captured in both identities; start must echo it and resume preserves it. Other saved results remain available.}
        retry_stale_failed: {type: boolean, default: false, description: Select only files with stale or failed analysis; incompatible with refresh. Resume preserves the admitted selection.}
        recover_incomplete: {type: boolean, default: false, description: 'Select only files with recoverable unfinished stages (stale, failed, partial, missing, canceled, interrupted or unavailable with a configured model); current stages stay cached and no source changes. Incompatible with refresh and retry_stale_failed. On resume the captured plan decides it; true for a non-recovery run returns 409.'}
        clear_results: {type: boolean, default: false, description: 'Clear previously saved analysis findings when starting a refreshed run from the beginning.'}
        limits: {$ref: '#/components/schemas/AnalysisRunLimits'}
        files: {type: array, description: 'Eligible files; in a scoped run, files outside the scope are retained. Remaining inventory is accounted for in excluded.', items: {$ref: '#/components/schemas/AnalysisPlannedFile'}}
        excluded: {type: array, items: {$ref: '#/components/schemas/AnalysisExcludedFile'}}
        providers: {type: array, items: {$ref: '#/components/schemas/AnalysisProviderRequirement'}}
        expected_model_requests: {type: integer, minimum: 0}
        max_model_requests: {type: integer, minimum: 0}
        security_review_intent_required: {type: boolean}
    AnalysisRunConfirmations:
      type: object
      additionalProperties: false
      required: [provider_ids, security_review]
      properties:
        provider_ids: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
        security_review: {type: boolean, description: Fresh explicit intent for Security AI, even for a local provider.}
    AnalysisRunStartRequest:
      type: object
      additionalProperties: false
      required: [identity, preview_id, limits, refresh, confirmations]
      properties:
        models: {$ref: '#/components/schemas/AnalysisModels'}
        identity: {$ref: '#/components/schemas/AnalysisQueueIdentity'}
        preview_id: {type: string, minLength: 1}
        limits: {$ref: '#/components/schemas/AnalysisRunLimits'}
        refresh: {type: boolean}
        stale_only: {type: boolean, default: false, description: Select only files with stale analysis; excludes unrelated failed or missing files. Incompatible with refresh, retry_stale_failed, and recover_incomplete. Resume preserves the captured selection.}
        stale_path: {type: string, maxLength: 4096, description: Optional exact project-relative file path to narrow stale_only analysis. Requires stale_only and an eligible saved selection target. Captured in both identities; start must echo it and resume preserves it. Other saved results remain available.}
        retry_stale_failed: {type: boolean, default: false, description: Select only files with stale or failed analysis; incompatible with refresh. Resume preserves the admitted selection.}
        recover_incomplete: {type: boolean, default: false, description: 'Select only files with recoverable unfinished stages (stale, failed, partial, missing, canceled, interrupted or unavailable with a configured model); current stages stay cached and no source changes. Incompatible with refresh and retry_stale_failed. On resume the captured plan decides it; true for a non-recovery run returns 409.'}
        clear_results: {type: boolean, default: false, description: 'Clear previously saved analysis findings when starting a refreshed run from the beginning. Must match the admitted preview.'}
        confirmations: {$ref: '#/components/schemas/AnalysisRunConfirmations'}
    AnalysisRunControlRequest:
      type: object
      additionalProperties: false
      required: [identity, action]
      description: Resume requires a fresh preview_id and confirmations; pause/cancel carry neither.
      properties:
        identity: {$ref: '#/components/schemas/AnalysisRunIdentity'}
        action: {type: string, enum: [pause, resume, cancel]}
        preview_id: {type: string, minLength: 1}
        confirmations: {$ref: '#/components/schemas/AnalysisRunConfirmations'}
    AnalysisRunCoverage:
      type: object
      required: [total, pending, running, succeeded, partial, failed, skipped, unavailable]
      description: File-stage work units; component counts sum to total. Exclusions remain in the plan.
      properties:
        total: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        succeeded: {type: integer, minimum: 0}
        partial: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        unavailable: {type: integer, minimum: 0}
    AnalysisSectionProgress:
      type: object
      required: [category, status, coverage, finding_count]
      properties:
        category: {$ref: '#/components/schemas/FindingCategory'}
        status: {$ref: '#/components/schemas/AnalysisRunStatus'}
        coverage: {$ref: '#/components/schemas/AnalysisRunCoverage'}
        finding_count: {type: integer, minimum: 0, nullable: true, description: Null without successful/partial evidence; stale counts are historical.}
    AnalysisStageProgress:
      type: object
      required: [stage, status, attempts, cached, finding_count]
      properties:
        stage: {$ref: '#/components/schemas/AnalysisStage'}
        status: {$ref: '#/components/schemas/AnalysisStageStatus'}
        attempts: {type: integer, minimum: 0, maximum: 4}
        cached: {type: boolean}
        finding_count: {type: integer, minimum: 0, nullable: true}
        report_id: {type: string, description: Producer-owned report reference; never a source blob.}
        reason: {type: string, description: Sanitized operational reason.}
    AnalysisRunFile:
      allOf:
        - {$ref: '#/components/schemas/AnalysisFileIdentity'}
        - type: object
          required: [stages]
          properties:
            stages: {type: array, items: {$ref: '#/components/schemas/AnalysisStageProgress'}}
    AnalysisRun:
      type: object
      required: [schema_version, identity, plan, status, files, sections, elapsed_seconds, window_elapsed_seconds, window_files_completed, created_at, updated_at]
      properties:
        features: {$ref: '#/components/schemas/AnalysisFeatureProgress', description: Only in runs saved before feature discovery was retired; such a run cannot resume.}
        docs: {$ref: '#/components/schemas/DocsRefresh'}
        checks: {$ref: '#/components/schemas/AnalysisChecks'}
        schema_version: {type: string, enum: ['1']}
        identity: {$ref: '#/components/schemas/AnalysisRunIdentity'}
        plan: {$ref: '#/components/schemas/AnalysisRunPreview'}
        status: {$ref: '#/components/schemas/AnalysisRunStatus'}
        files: {type: array, items: {$ref: '#/components/schemas/AnalysisRunFile'}}
        sections: {type: array, minItems: 3, maxItems: 3, description: Exactly one entry per category., items: {$ref: '#/components/schemas/AnalysisSectionProgress'}}
        elapsed_seconds: {type: integer, format: int64, minimum: 0}
        window_elapsed_seconds: {type: integer, format: int64, minimum: 0}
        window_files_completed: {type: integer, minimum: 0, maximum: 500}
        reason: {type: string, description: Sanitized operational failure or pause reason.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AnalysisFeaturePlan:
      type: object
      required: [expected_hash, goals_hash, workspace_hash, excluded_paths, provider_id, max_model_requests]
      description: The retired feature-discovery step of a saved run, kept so such runs stay readable.
      properties:
        expected_hash: {type: string, description: Captured feature-store hash used for compare-and-swap publication.}
        goals_hash: {type: string}
        workspace_hash: {type: string}
        excluded_paths: {type: array, items: {type: string}, description: Explicit file exclusions honored by feature context and suggested paths.}
        provider_id: {type: string}
        max_model_requests: {type: integer, minimum: 0, maximum: 4, description: Remaining requests including retries; zero after this step completes.}
        reason: {type: string}
    AnalysisDocsPlan:
      type: object
      required: [provider_id, components, max_model_requests]
      description: 'The run''s last step, after its files: components whose files'' summaries changed are summarized again with the analyze model, then the overview is written again when a summary changed or it is not current. Needs the analyze provider''s consent; its requests are not in the preview totals.'
      properties:
        provider_id: {type: string}
        components: {type: integer, minimum: 0, maximum: 16, description: Components the docs show.}
        max_model_requests: {type: integer, minimum: 0, description: 'At most one request per component and one for the overview, each with its retries; zero when the analyze model is not configured.'}
        reason: {type: string}
    AnalysisChecksPlan:
      type: object
      required: [commands]
      description: 'The project checks, run once after the files and before the docs: every file''s parser diagnostics and AGENTS.md code budgets, each subproject''s lint and tests from its toolchain profile when the project lets checks run its code, and semgrep with the project''s own rules (.semgrep.yml, .semgrep.yaml or .semgrep/) when semgrep is installed. They run in a copy of the project and make no model requests.'
      properties:
        commands:
          type: array
          maxItems: 64
          items:
            type: object
            required: [name, kind, command]
            properties:
              name: {type: string, description: '"lint", "tests: web", "semgrep".'}
              kind: {type: string, enum: [lint, test, semgrep]}
              dir: {type: string, description: The subproject directory the command runs in; empty for the root.}
              command: {type: array, items: {type: string}, description: The argument list; never run through a shell.}
        reason: {type: string, description: Why commands that run the project's code are left out.}
    AnalysisChecks:
      type: object
      required: [status, checks, issues, at]
      description: What the checks did. Each source whose commands all ran closes the issues it no longer reports.
      properties:
        status: {type: string, enum: [completed, canceled, failed]}
        checks:
          type: array
          items:
            type: object
            required: [name, state, issues]
            properties:
              name: {type: string, description: 'parse, code budgets, or a planned command''s name.'}
              command: {type: array, items: {type: string}}
              state: {type: string, enum: [passed, failed, skipped, canceled, unavailable]}
              issues: {type: integer, minimum: 0, description: 'Issues it reported, at most 50 per command.'}
              output: {type: string, description: Sanitized and bounded output.}
              duration_ms: {type: integer, format: int64}
        issues: {type: integer, minimum: 0}
        reason: {type: string}
        at: {type: string, format: date-time}
    AskRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, question]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        question: {type: string, minLength: 1, maxLength: 2000}
        confirm_remote_provider: {type: boolean, default: false}
    AskCitation:
      type: object
      required: [path, start_line, end_line, quote, content_hash]
      properties:
        path: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        quote: {type: string, maxLength: 400}
        content_hash: {type: string, description: Hash of the file the quote was found in.}
    AskAnswer:
      type: object
      required: [project_id, project_revision, question, answer, citations, model, turns, tool_calls, at]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        question: {type: string}
        answer: {type: string, maxLength: 12000, description: Model-written; the citations are what Mini-Orca checked.}
        citations: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/AskCitation'}}
        model: {type: string}
        turns: {type: integer, minimum: 0}
        tool_calls: {type: integer, minimum: 0}
        at: {type: string, format: date-time}
    DocsRefreshRequest:
      type: object
      additionalProperties: false
      required: [project_id, project_revision]
      properties:
        project_id: {type: string, minLength: 1}
        project_revision: {type: string, minLength: 1}
        confirm_remote_provider: {type: boolean, default: false}
    DocsRefresh:
      type: object
      required: [status, components, summarized, kept, overview, at]
      properties:
        status: {type: string, enum: [running, completed, skipped, failed], description: Running only for a refresh started from the Docs page.}
        components: {type: integer, minimum: 0, description: Components with current file summaries to summarize.}
        summarized: {type: integer, minimum: 0, description: Component summaries written by this refresh.}
        kept: {type: integer, minimum: 0, description: Component summaries that were already current.}
        overview: {type: string, enum: [written, kept, failed, skipped]}
        reason: {type: string, description: Sanitized reason a refresh was skipped or failed; never provider or source text.}
        at: {type: string, format: date-time}
    AnalysisFeatureProgress:
      type: object
      required: [status, attempts, suggestion_count]
      properties:
        status: {$ref: '#/components/schemas/AnalysisStageStatus'}
        attempts: {type: integer, minimum: 0, maximum: 4}
        suggestion_count: {type: integer, nullable: true, minimum: 0, maximum: 5, description: Ideas newly added by this run's generation, not the cumulative library; zero (completed_empty) means no new ideas. Unknown until a successful report. Separate from finding counts.}
        report_hash: {type: string}
        reason: {type: string}
    ChangeIdentity:
      type: object
      required: [project_id, project_revision, revision, hash]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        revision: {type: integer, minimum: 0}
        hash: {type: string}
    ChangeReanalysisRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          properties:
            confirm_remote_provider: {type: boolean}
    ChangeReanalysis:
      type: object
      required: [outcome, reason, warnings]
      properties:
        outcome: {type: string, enum: [still_valid, not_valid]}
        reason: {type: string, maxLength: 1024, description: The model's explanation; a suggestion, not a verified finding.}
        session: {$ref: '#/components/schemas/ChangeSession', description: The task captured again; only for still_valid.}
        deleted: {type: string, description: The deleted task's ID; only for not_valid.}
        dismissed_issues: {type: integer, minimum: 0, description: Linked issues of this checkout that were dismissed.}
        warnings: {type: array, items: {type: string}}
    ChangeRetakeRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [confirm_execution]
          properties:
            confirm_remote_provider: {type: boolean}
            confirm_execution: {type: boolean, description: Required true; a still-valid task checks out a new worktree, which can run repository filters.}
    ChangeRetake:
      type: object
      required: [outcome, reason, warnings]
      properties:
        outcome: {type: string, enum: [still_valid, not_valid]}
        reason: {type: string, maxLength: 1024, description: The model's explanation; a suggestion, not a verified finding.}
        opened: {$ref: '#/components/schemas/ChangeOpened', description: The task started again in its new worktree; only for still_valid.}
        deleted: {type: string, description: The old task's ID once it is deleted.}
        dismissed_issues: {type: integer, minimum: 0, description: Linked issues that were dismissed; only for not_valid.}
        warnings: {type: array, items: {type: string}}
    ChangeReviewRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          properties:
            notes: {type: string, maxLength: 2048, description: Reviewer notes kept with this approval; cleared when the approval is.}
    Event:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [workflow, project_index, analysis, findings, docs, configuration, agent_settings, agent_run]}
        session_id: {type: string}
        workflow_id: {type: string, description: The task's workflow run, or the analysis run of an analysis event.}
        title: {type: string}
        stage: {type: string, enum: [create, test, review, human_review, '']}
        status: {type: string, description: The workflow status, or the analysis run status of an analysis event.}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        cost: {$ref: '#/components/schemas/AgentCostEstimate'}
        worktree_path: {type: string, description: The worktree a task's event comes from, on the active project's stream.}
    QuarantinedFile:
      type: object
      required: [kind, file, reason, remedy]
      properties:
        kind: {type: string, enum: [agent_journal, task, analysis_run]}
        file: {type: string, description: The record, relative to the checkout.}
        quarantined_as: {type: string, description: Where its bytes were moved; absent for skipped newer records.}
        reason: {type: string}
        remedy: {type: string}
        at: {type: string, format: date-time}
    QuarantineReport:
      type: object
      required: [files, skipped]
      properties:
        files: {type: array, items: {$ref: '#/components/schemas/QuarantinedFile'}}
        skipped: {type: array, items: {$ref: '#/components/schemas/QuarantinedFile'}}
    UsageTotal:
      type: object
      required: [runs, usage, cost]
      properties:
        runs: {type: integer}
        usage: {$ref: '#/components/schemas/AgentUsage'}
        cost: {$ref: '#/components/schemas/AgentCostEstimate'}
    ChangeUsageReport:
      type: object
      required: [project_id, project_revision, tasks, other, total]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        currency: {type: string}
        price_version: {type: string}
        tasks:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/UsageTotal'}
              - type: object
                required: [session_id, title, updated_at]
                properties:
                  session_id: {type: string}
                  title: {type: string}
                  kind: {type: string}
                  state: {type: string}
                  updated_at: {type: string, format: date-time}
        other: {$ref: '#/components/schemas/UsageTotal'}
        total: {$ref: '#/components/schemas/UsageTotal'}
    ChangeCommentRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [path, side, line, text]
          properties:
            path: {type: string}
            side: {type: string, enum: [new, old], description: new for added and context lines, old for removed lines.}
            line: {type: integer, minimum: 1}
            text: {type: string, minLength: 1, maxLength: 1024}
    ChangeComment:
      type: object
      required: [id, path, side, line, excerpt, text, hash, created_at]
      properties:
        id: {type: string}
        path: {type: string}
        side: {type: string, enum: [new, old]}
        line: {type: integer, minimum: 1}
        excerpt: {type: string, maxLength: 240, description: The commented line as written in the proposal.}
        text: {type: string, maxLength: 1024}
        hash: {type: string, description: The proposal the comment was written on.}
        sent_revision: {type: integer, description: The revision whose repair brief carried the comment; absent while open.}
        created_at: {type: string, format: date-time}
    ChangeReviewOverride:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [workflow_id, reason]
          properties:
            workflow_id: {type: string}
            reason: {type: string, minLength: 1, maxLength: 1024}
    PlanEvidence:
      type: object
      additionalProperties: false
      required: [path, hash, start_line, end_line, quote, observation]
      properties:
        path: {type: string}
        hash: {type: string}
        start_line: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        quote: {type: string, minLength: 1, maxLength: 1024}
        observation: {type: string, minLength: 1, maxLength: 512, description: Model interpretation; validated source provenance does not verify the interpretation.}
    ChangePlanInput:
      type: object
      required: [problem, approach]
      properties:
        problem: {type: string, minLength: 1, maxLength: 8192}
        evidence: {type: string, maxLength: 8192}
        approach: {type: string, minLength: 1, maxLength: 8192}
        non_goals: {type: array, maxItems: 16, items: {type: string, maxLength: 8192}}
        read_paths: {type: array, maxItems: 8, uniqueItems: true, items: {type: string}, description: Existing context paths distinct from write targets; policy and size limits apply.}
        citations: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/PlanEvidence'}}
        assumptions: {type: array, maxItems: 8, items: {type: string, minLength: 1, maxLength: 512}}
    ChangePlan:
      allOf:
        - {$ref: '#/components/schemas/ChangePlanInput'}
        - type: object
          required: [hash]
          properties:
            hash: {type: string, description: "Captured intent, criteria, source, instructions and workspace identity."}
            approved_hash: {type: string}
            read_targets: {type: array, items: {$ref: '#/components/schemas/ChangeTarget'}}
    ChangeFileReviewRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [path]
          properties:
            path: {type: string}
    ChangeTarget:
      type: object
      properties:
        path: {type: string}
        hash: {type: string}
        exists: {type: boolean}
        content: {type: string}
        mode: {type: integer}
        test: {type: boolean, description: A test file by convention or by a test_files pattern of the project's AGENTS.md when the target was captured.}
    ProjectRules:
      type: object
      required: [project_id, project_revision, test_patterns, guides, problems]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        test_patterns: {type: array, items: {type: string}, description: "Project-relative, case-insensitive globs: * stays within a path segment, ** spans segments, a glob without a slash matches the file name anywhere."}
        guides: {type: array, items: {type: string}, description: Indexed AGENTS.md files.}
        problems: {type: array, items: {$ref: '#/components/schemas/RulesProblem'}}
    RulesProblem:
      type: object
      required: [path, message]
      properties:
        path: {type: string}
        message: {type: string}
    CodeBudgets:
      type: object
      properties:
        file_lines: {type: integer}
        function_lines: {type: integer}
        function_complexity: {type: integer}
    BudgetFinding:
      type: object
      required: [kind, value, limit]
      properties:
        kind: {type: string, enum: [file_lines, function_lines, function_complexity]}
        function: {type: string}
        line: {type: integer}
        value: {type: integer}
        base: {type: integer, description: The value before the task; absent for a new file or function.}
        limit: {type: integer}
    ChangeRules:
      type: object
      required: [session_id, revision, files, problems]
      properties:
        session_id: {type: string}
        revision: {type: integer}
        files:
          type: array
          items:
            type: object
            required: [path, budgets, lines, test, proposed]
            properties:
              path: {type: string}
              budgets: {$ref: '#/components/schemas/CodeBudgets'}
              lines: {type: integer}
              base_lines: {type: integer}
              not_checked: {type: string, description: Why the file's functions could not be measured.}
              over: {type: array, items: {$ref: '#/components/schemas/BudgetFinding'}, description: Made worse by the task; the complexity gate fails.}
              debt: {type: array, items: {$ref: '#/components/schemas/BudgetFinding'}, description: Already over before the task and not grown.}
              test: {type: boolean}
              proposed: {type: boolean}
              imports:
                type: array
                items: {type: object, properties: {from: {type: string}, never: {type: array, items: {type: string}}}}
              sources: {type: array, items: {type: string}}
        problems: {type: array, items: {$ref: '#/components/schemas/RulesProblem'}}
    ChangeEdit:
      type: object
      properties:
        path: {type: string}
        status: {type: string, enum: [added, modified, deleted, renamed], description: Absent in proposals that only add or modify files. Deleting and renaming need a task that owns its worktree.}
        old_path: {type: string, description: Where a renamed file came from.}
        content: {type: string, description: Empty for a deleted file.}
        summary: {type: string, description: Advisory per-file rationale.}
        criteria: {type: array, maxItems: 16, items: {type: integer, minimum: 1}, description: Advisory references to one-based acceptance criteria; not coverage proof.}
        hash: {type: string}
        diff: {$ref: '#/components/schemas/UnifiedDiff'}
    ChangeCheckResult:
      type: object
      properties:
        name: {type: string}
        required: {type: boolean}
        state: {type: string, enum: [not-run, passed, failed, skipped, canceled, unavailable]}
        command: {type: array, items: {type: string}}
        output: {type: string}
        exit_code: {type: integer}
        duration_ms: {type: integer, minimum: 0}
        outcome: {type: string, enum: [failed_before_change, already_passes, could_not_execute, known_failures, also_failed_before, not_affected], description: "New-test baseline observation (failed_before_change, already_passes, could_not_execute), or how a failure compares with the tree before the change: known_failures passes because every failure already happened there, also_failed_before still blocks because the new failures could not be told apart. not_affected marks the subprojects no changed file is in."}
    ChangeCreateRequest:
      description: Supplying plan requires at least one acceptance criterion. Legacy sessions without a plan remain supported.
      type: object
      required: [project_id, project_revision, kind, title, paths]
      properties:
        plan: {$ref: '#/components/schemas/ChangePlanInput'}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string, enum: [fix, performance, security, feature, instructions]}
        title: {type: string, minLength: 1, maxLength: 200}
        paths: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string}}
        acceptance_criteria: {type: array, maxItems: 16, items: {type: string, maxLength: 1024}}
        finding_targets: {type: array, maxItems: 16, uniqueItems: true, items: {$ref: '#/components/schemas/FindingTarget'}}
    ChangeOpenRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeCreateRequest'}
        - type: object
          properties:
            worktree: {type: boolean, description: Capture the task in a new branch and worktree created for it from the current HEAD.}
            confirm_execution: {type: boolean, description: Required true with worktree; checking out the worktree can run repository filters.}
    ChangeOpened:
      allOf:
        - {$ref: '#/components/schemas/ChangeSession'}
        - type: object
          required: [worktree_path, branch, warnings]
          properties:
            worktree_path: {type: string, description: Absolute path of the task's worktree; later requests for the task carry it as worktree_path.}
            branch: {type: string}
            warnings: {type: array, items: {type: string}, description: For example that the worktree runs other check commands and needs its own trust.}
    ChangeMessageRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          properties:
            message: {type: string, maxLength: 8192}
            profile: {$ref: '#/components/schemas/ModelSelection', default: code}
            confirm_remote_provider: {type: boolean}
            repair: {type: boolean}
            include_comments: {type: boolean, description: Send the open line comments as a repair brief; the message may then be empty.}
    ChangeCheckRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          properties:
            run_tests: {type: boolean}
            run_lint: {type: boolean}
    ChangeApplyRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [confirm]
          properties:
            confirm: {type: boolean, enum: [true]}
            head: {type: string, description: Reviewed Git HEAD for Apply and Commit}
            branch: {type: string, description: Reviewed local branch}
            commit_message: {type: string, maxLength: 4096, description: Supplying this opts into Apply and Commit; limit is 4096 UTF-8 bytes}
    ChangeWorkflowModels:
      type: object
      additionalProperties: false
      required: [create, test, review]
      properties:
        create: {$ref: '#/components/schemas/ModelSelection'}
        test: {$ref: '#/components/schemas/ModelSelection'}
        review: {$ref: '#/components/schemas/ModelSelection'}
    ChangeWorkflowRequest:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          properties:
            stream_output: {type: boolean, default: false, description: Opt into bounded private model streaming; every selected provider must support it.}
            plan_hash: {type: string, description: Required matching plan.hash for planned sessions; explicitly approves captured intent.}
            resume_from: {type: string, enum: [create, test, checks, review], default: create, description: "Where the run starts: create writes the change again; test keeps the implementation; checks keeps the whole proposal and runs the checks, then the reviewers; review needs live passing checks for this hash."}
            auto_repair: {type: boolean, default: false, description: Opt into up to two automatic repairs within approved scope.}
            message: {type: string, maxLength: 8192, description: Required unless include_comments sends the open line comments.}
            include_comments: {type: boolean, description: Send the open line comments as a repair brief; the request and brief stay within 8192 bytes.}
            models:
              type: object
              additionalProperties: false
              description: Omitted or empty roles resolve from agent_runtime.roles; defaults are bug, code, analyze. Resolved remote profiles still require confirmed_profiles consent.
              properties:
                create: {type: string, description: Catalog selection or configured profile; empty uses the configured Creation role.}
                test: {type: string, description: Catalog selection or configured profile; empty uses the configured Testing role.}
                review: {type: string, description: Catalog selection or configured profile; empty uses the configured Review role.}
            confirmed_profiles: {type: array, items: {$ref: '#/components/schemas/ModelSelection'}}
            confirm_security: {type: boolean, description: Required true for security tasks}
    ChangeWorkflowControl:
      type: object
      additionalProperties: false
      required: [project_id, project_revision, workflow_id]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        workflow_id: {type: string}
    ChangeInputResponse:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [workflow_id, request_id, decision]
          properties:
            workflow_id: {type: string}
            request_id: {type: string}
            decision: {type: string, enum: [approve, reject, cancel]}
    ChangeInput:
      allOf:
        - {$ref: '#/components/schemas/ChangeIdentity'}
        - type: object
          required: [request_id, run_id, workflow_id, node_id, action, schema, status, scope, expires_at]
          properties:
            request_id: {type: string}
            run_id: {type: string}
            workflow_id: {type: string}
            node_id: {type: string, enum: [human_review]}
            action: {type: string, enum: [review_proposal]}
            schema: {type: string, enum: [proposal-review-v1]}
            status: {type: string, enum: [waiting, approved, rejected, canceled, expired]}
            expires_at: {type: string, format: date-time}
            received_at: {type: string, format: date-time}
            scope:
              type: array
              description: Captured paths and immutable source/proposal hashes; includes unchanged captured targets.
              items:
                type: object
                required: [path, source_exists, source_hash, proposal_hash]
                properties:
                  path: {type: string}
                  source_exists: {type: boolean}
                  source_hash: {type: string}
                  proposal_hash: {type: string}
    ChangeWorkflowReview:
      type: object
      required: [proposal_hash, verdict, summary, findings]
      properties:
        proposal_hash: {type: string}
        verdict: {type: string, enum: [approve, changes_requested]}
        summary: {type: string, minLength: 1, maxLength: 4096}
        findings: {type: array, maxItems: 80, description: Blocking issues; approve exactly when empty., items: {type: string, minLength: 1, maxLength: 1024}}
        notes: {type: array, maxItems: 40, description: Advisory suggestions that never decide the verdict., items: {type: string, minLength: 1, maxLength: 1024}}
    ChangeSpecialistReview:
      type: object
      required: [id, status, evidence, model]
      properties:
        id: {type: string, enum: [correctness, architecture, test_quality, security, performance]}
        status: {type: string, enum: [pending, running, completed, failed, canceled, stale, interrupted, skipped, paused]}
        reason: {type: string}
        evidence: {type: string, enum: [model_advice, unmeasured], description: Performance specialist advice is always unmeasured; other reviews are model advice.}
        model: {$ref: '#/components/schemas/ScopedModel'}
        review:
          allOf:
            - {$ref: '#/components/schemas/ChangeWorkflowReview'}
            - type: object
              properties:
                findings: {type: array, maxItems: 16, items: {type: string, minLength: 1, maxLength: 1024}}
                notes: {type: array, maxItems: 8, items: {type: string, minLength: 1, maxLength: 1024}}
    ChangeWorkflow:
      type: object
      required: [id, status, models, stages, started_at, updated_at]
      properties:
        stream_output: {type: boolean, default: false}
        input: {$ref: '#/components/schemas/ChangeInput'}
        id: {type: string}
        status: {type: string, enum: [running, canceling, failed, canceled, stale, interrupted, outdated, changes_requested, awaiting_human_review, paused], description: "paused: a stage's subscription plan reached its usage limit; see pause."}
        attempt: {type: integer, minimum: 1}
        resume_from: {type: string, enum: [create, test, checks, review]}
        reason: {type: string}
        auto_repair: {type: boolean}
        auto_repair_attempts: {type: integer}
        models: {$ref: '#/components/schemas/ChangeWorkflowModels'}
        stages:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [name, status]
            properties:
              started_at: {type: string, format: date-time}
              finished_at: {type: string, format: date-time}
              name: {type: string, enum: [create, test, review, human_review]}
              status: {type: string, enum: [pending, running, completed, failed, canceled, stale, interrupted, skipped, blocked, waiting, paused]}
              model: {$ref: '#/components/schemas/ScopedModel'}
              usage: {$ref: '#/components/schemas/AgentUsage'}
              cost: {$ref: '#/components/schemas/AgentCostEstimate'}
              tools:
                type: object
                description: "The stage's latest run as a tool-using agent in the task's worktree (create and test stages on pi, Claude Code or agy); absent for a one-shot proposal."
                required: [calls, turns, finished]
                properties:
                  calls: {type: integer, minimum: 0}
                  summary: {type: string, description: "Calls per tool, most used first, such as read_file 12, edit_file 4"}
                  turns: {type: integer, minimum: 0, description: Model turns the run took}
                  finished: {type: boolean, description: Whether the agent ended with finish}
        review:
          $ref: '#/components/schemas/ChangeWorkflowReview'
        override:
          type: object
          description: A human override of a changes_requested model verdict, bound to its proposal hash. It grants no approval.
          required: [proposal_hash, reason, at]
          properties:
            proposal_hash: {type: string}
            reason: {type: string, minLength: 1, maxLength: 1024}
            at: {type: string, format: date-time}
        pause:
          type: object
          description: Set while the run is paused because a stage's subscription plan reached its usage limit. Nothing the stage left half done was kept; start the workflow again with resume_from to continue.
          required: [stage, resume_from, provider]
          properties:
            stage: {type: string, enum: [create, test, review], description: The stage that reached the limit}
            resume_from: {type: string, enum: [create, test, checks, review], description: The resume_from that continues the run}
            provider: {type: string, description: The CLI whose plan reached its limit (claude, agy or pi)}
            resumes_at: {type: string, format: date-time, description: When the plan's limit resets, when the CLI said so}
        specialists:
          type: array
          maxItems: 5
          description: Admitted reviewers in canonical order, sharing the selected Review profile and exact checked proposal. Missing on legacy workflow records.
          items: {$ref: '#/components/schemas/ChangeSpecialistReview'}
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChangeSession:
      type: object
      required: [id, project_id, project_revision, kind, title, revision, hash, state, freshness, targets, changes, messages, checks]
      properties:
        git: {$ref: '#/components/schemas/GitIdentity'}
        worktree:
          type: object
          required: [base, branch]
          description: Set when the task owns the worktree created for it. Its proposal is the worktree's diff against base (new, deleted and renamed files included; edits made directly in the worktree are picked up as a new version), its freshness depends only on the worktree staying at base on branch, and accepting it commits on branch. The worktree is locked while agents run.
          properties:
            base: {type: string}
            branch: {type: string}
        commit: {$ref: '#/components/schemas/ChangeCommit'}
        schema_version: {type: integer, enum: [1]}
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        title: {type: string}
        acceptance_criteria: {type: array, items: {type: string}}
        finding_targets: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/FindingTarget'}}
        revision: {type: integer}
        hash: {type: string}
        state: {type: string, enum: [draft, applied, undone, prepared, undoing, recovery_required]}
        freshness: {type: string, enum: [current, stale]}
        plan: {$ref: '#/components/schemas/ChangePlan'}
        reviewed_files: {type: array, uniqueItems: true, items: {type: string}}
        file_review_hash: {type: string}
        last_reviewed_hash: {type: string}
        last_reviewed_changes: {type: array, items: {$ref: '#/components/schemas/ChangeEdit'}}
        review_diff: {type: array, items: {$ref: '#/components/schemas/ChangeEdit'}, description: Differences from the last completely reviewed proposal to the current proposal.}
        targets: {type: array, items: {$ref: '#/components/schemas/ChangeTarget'}}
        changes: {type: array, items: {$ref: '#/components/schemas/ChangeEdit'}}
        messages:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              content: {type: string}
              created_at: {type: string, format: date-time}
        checks: {type: array, items: {$ref: '#/components/schemas/ChangeCheckResult'}}
        check_options: {type: object, properties: {run_tests: {type: boolean}, run_lint: {type: boolean}}}
        scope_version: {type: integer, enum: [1], description: Present when freshness is scoped to the files the session depends on; absent on older sessions bound to the whole tree.}
        scope:
          type: array
          maxItems: 512
          description: Sorted dependency files outside the captured targets and read context, with their content hashes.
          items: {type: object, required: [path, hash], properties: {path: {type: string}, hash: {type: string}}}
        stale_reason: {type: string, description: Set on read when freshness is stale; names the changed file.}
        main_changed:
          type: object
          description: Set on read for a task in its own worktree whose files the main branch changed since the task's base commit; it can be retaken.
          required: [branch, head, paths]
          properties:
            branch: {type: string}
            head: {type: string}
            paths: {type: array, items: {type: string}}
        checks_workspace_hash: {type: string, description: Whole-tree fingerprint of the project the checks ran on.}
        checks_outdated: {type: boolean, description: Set on read when the project changed after the checks ran; they must run again before approval or Apply.}
        reviewed_hash: {type: string}
        review_notes: {type: string, maxLength: 2048, description: Notes given with the approval of reviewed_hash.}
        comments: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/ChangeComment'}}
        repair_attempts: {type: integer, maximum: 3}
        workflow: {$ref: '#/components/schemas/ChangeWorkflow'}
        context_manifest: {$ref: '#/components/schemas/ContextManifest'}
        instructions: {type: object, additionalProperties: {type: string}}
        policy_fingerprint: {type: string}
        workspace_hash: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChangeMutationResult:
      type: object
      properties:
        commit: {$ref: '#/components/schemas/ChangeCommit'}
        session_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        state: {type: string}
        hash: {type: string}
        undo_available: {type: boolean}
        index: {$ref: '#/components/schemas/ProjectIndex'}
        warnings: {type: array, items: {type: string}}
        verification: {$ref: '#/components/schemas/ChangeVerification'}
    ChangeHistoryEntry:
      type: object
      description: Local conversation summary; use a guarded selected read or resume for contents.
      required: [id, project_id, project_revision, kind, title, revision, hash, state, freshness, updated_at]
      properties:
        commit: {$ref: '#/components/schemas/ChangeCommit'}
        finding_targets: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/FindingTarget'}}
        id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        kind: {type: string}
        title: {type: string}
        revision: {type: integer}
        hash: {type: string}
        state: {type: string}
        freshness: {type: string}
        workflow_status: {type: string}
        workflow_reason: {type: string}
        paths: {type: array, maxItems: 64, items: {type: string}, description: The task's write paths.}
        updated_at: {type: string, format: date-time}
    ChangeVerification:
      type: object
      required: [schema_version, session_id, project_id, project_revision, proposal_hash, workspace_hash, status, checks, updated_at]
      properties:
        schema_version: {type: integer, enum: [1]}
        session_id: {type: string}
        project_id: {type: string}
        project_revision: {type: string}
        proposal_hash: {type: string}
        workspace_hash: {type: string}
        status: {type: string, enum: [verified, failed, unavailable, canceled, stale]}
        reason: {type: string}
        checks: {type: array, items: {type: object}}
        updated_at: {type: string, format: date-time}
    GitIdentity:
      type: object
      required: [head, branch]
      properties:
        head: {type: string}
        branch: {type: string}
    ChangeCommit:
      allOf:
        - {$ref: '#/components/schemas/GitIdentity'}
        - type: object
          required: [state, message]
          properties:
            state: {type: string, enum: [pending, failed, committed]}
            message: {type: string}
            oid: {type: string}
            error: {type: string}
    GitRepository:
      allOf:
        - {$ref: '#/components/schemas/GitIdentity'}
        - type: object
          required: [project_id, project_revision, available, root, at_root, dirty, conflicts]
          properties:
            project_id: {type: string}
            project_revision: {type: string}
            available: {type: boolean}
            root: {type: string}
            at_root: {type: boolean}
            dirty: {type: boolean}
            merge_head: {type: string}
            operation: {type: string}
            conflicts: {type: array, items: {type: string}}
    GitMutationRequest:
      allOf:
        - {$ref: '#/components/schemas/GitIdentity'}
        - type: object
          required: [project_id, project_revision]
          properties:
            project_id: {type: string}
            project_revision: {type: string}
            confirm: {type: boolean, description: Required true for mutations}
            confirm_execution: {type: boolean, description: Required true for mutations in addition to current project execution trust}
            target_branch: {type: string, description: New branch for worktrees; existing local branch for switch}
            path: {type: string, description: Absolute new path directly inside the project .worktrees directory or selected source path for merge or discard or cleanup-merged}
            source_head: {type: string, description: Reviewed source worktree HEAD for merge or preview or discard or cleanup-merged}
            source_branch: {type: string, description: Required source branch identity for discard or cleanup-merged}
            merge_head: {type: string, description: Identified MERGE_HEAD for abort}
            keep_worktree: {type: boolean, description: Merge only; keep the merged worktree and its branch instead of removing them.}
            discard_work: {type: boolean, description: Discard only; remove a worktree with no tasks together with its uncommitted changes and its branch, commits the current branch lacks included.}
    GitMutationResult:
      type: object
      required: [state, warnings]
      properties:
        state: {type: string, enum: [created, switched, merged, discarded, conflicts, aborted, failed]}
        previous_head: {type: string, description: The commit the branch was on before a completed merge, for POST git/merge-checks}
        path: {type: string}
        removed_worktree: {type: string, description: Absolute source worktree path returned only when removal after merge or discard or cleanup-merged completed}
        removed_branch: {type: string, description: Reviewed source branch returned only after guarded deletion following successful merge, cleanup-merged, or discard of a branch the current branch contains}
        completed: {type: array, description: "Finding completions persisted by this merge or cleanup, independent of later cleanup success", items: {$ref: '#/components/schemas/FindingCompletion'}}
        repository: {$ref: '#/components/schemas/GitRepository'}
        index: {$ref: '#/components/schemas/ProjectIndex'}
        error: {type: string}
        warnings: {type: array, items: {type: string}}
    MergeChecksRequest:
      type: object
      required: [project_id, project_revision, from, to]
      properties:
        project_id: {type: string}
        project_revision: {type: string}
        from: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$', description: The commit before the merge}
        to: {type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$', description: The merged commit the checkout is on}
    MergeChecks:
      type: object
      required: [from, to, outcome, summary, changed_paths, checks]
      properties:
        from: {type: string}
        to: {type: string}
        outcome: {type: string, enum: [passed, failed, unavailable]}
        summary: {type: string}
        changed_paths: {type: integer, minimum: 0}
        checks: {type: array, items: {$ref: '#/components/schemas/ChangeCheckResult'}}
    GitMergePreview:
      type: object
      required: [target, source, path, diff, commits]
      properties:
        target: {$ref: '#/components/schemas/GitIdentity'}
        source: {$ref: '#/components/schemas/GitIdentity'}
        path: {type: string}
        diff: {type: string}
        commits: {type: string}
    GitWorkspace:
      allOf:
        - {$ref: '#/components/schemas/GitRepository'}
        - type: object
          required: [branches, worktrees]
          properties:
            branches:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  head: {type: string}
                  worktree_path: {type: string}
            worktrees:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/GitIdentity'}
                  - type: object
                    properties:
                      path: {type: string}
                      current: {type: boolean}
                      locked: {type: boolean}
                      lock_reason: {type: string, description: "Mini-Orca locks a task's worktree while agents run there; a lock it left behind is released when this list is read."}
                      prunable: {type: boolean}
                      dirty: {type: boolean, description: Omitted when status cannot be read}
                      mergeable: {type: boolean, description: Clean local branches with shared history and incoming commits; excludes current or locked or prunable worktrees and in-progress Git operations. Does not predict conflicts.}
                      integration: {type: string, enum: [current, merged, up_to_date, behind, unrelated], description: Passive ancestry comparison against the selected destination; merged includes equal HEADs and does not imply task verification or cleanup eligibility. Omitted if unavailable.}
                      overlap_paths: {type: array, items: {type: string}, description: Committed paths changed on both branches since their merge base; advisory overlap rather than predicted conflicts.}
                      completed: {type: array, items: {$ref: '#/components/schemas/ChangeHistoryEntry'}}
                      error: {type: string}
