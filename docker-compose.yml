services:
  kasuri:
    build:
      context: .
      dockerfile: Dockerfile
    image: kasuri:latest
    container_name: kasuri
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./projects:/app/projects:rw
      - ./logs:/app/logs:rw
    environment:
      - KASURI_CONFIG=/app/config.yaml
      - KASURI_BIND_ADDRESS=0.0.0.0:9090
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - kasuri-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  lm-studio:
    image: ghcr.io/lmstudio-community/lmstudio:latest
    container_name: lm-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - lm-studio-data:/root/.cache/lm-studio
    networks:
      - kasuri-network
    profiles:
      - with-llm

volumes:
  lm-studio-data:

networks:
  kasuri-network:
    driver: bridge
